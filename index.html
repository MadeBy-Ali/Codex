<style>
  :root { --bg:#05090c; --sand:#E8E2D6; --ice:#A9E6F5; --brass:#B8935A; --serif:Cinzel, Georgia, serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--sand); font-family: Montserrat, system-ui, sans-serif; }
  body { overflow: hidden; }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .simple canvas#scene { display: none; }
  .simple body, body.simple { overflow: auto; }

  /* background ornament for the phone version: a slow gear and drifting cold fog */
  #bg { display: none; position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .simple #bg { display: block; }
  #bg .gear { position: absolute; right: -28vmin; top: -10vmin; width: 90vmin; opacity: .16; animation: spin 140s linear infinite; }
  #bg .gear.two { right: auto; left: -34vmin; top: auto; bottom: -26vmin; width: 70vmin; opacity: .12; animation-duration: 110s; animation-direction: reverse; }
  #bg .fog { position: absolute; width: 90vmax; height: 60vmax; left: -20vmax; bottom: -30vmax; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(169,230,245,.16), transparent); animation: drift 26s ease-in-out infinite alternate; }
  #bg .fog.b { left: auto; right: -30vmax; bottom: auto; top: -26vmax; animation-duration: 34s; opacity: .8; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes drift { from { transform: translate(0, 0) scale(1); } to { transform: translate(8vmax, -5vmax) scale(1.15); } }
  @media (prefers-reduced-motion: reduce) { #bg .gear, #bg .fog, .sigil svg { animation: none !important; } }

  /* opener */
  #opener { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; text-align: center; padding: 24px;
    background: radial-gradient(ellipse at 50% 40%, #0d1a20, var(--bg) 70%); transition: opacity 1.4s ease, visibility 1.4s; }
  #opener.gone { opacity: 0; visibility: hidden; pointer-events: none; }
  .sigil { width: 92px; height: 92px; margin: 0 auto 22px; }
  .sigil svg { width: 100%; height: 100%; animation: spin 40s linear infinite; filter: drop-shadow(0 0 10px rgba(169,230,245,.35)); }
  #opener .k { font-size: 11px; letter-spacing: .3em; font-weight: 700; color: var(--brass); text-transform: uppercase; }
  #opener h1 { margin: 14px 0 8px; font-family: var(--serif); font-size: clamp(34px, 7vw, 66px); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  #opener p { margin: 0 0 30px; opacity: .62; font-size: 14.5px; letter-spacing: .02em; }
  .pill { font: inherit; font-size: 12px; letter-spacing: .24em; text-transform: uppercase; font-weight: 700; color: var(--bg); background: var(--ice);
    border: 0; padding: 14px 28px; border-radius: 3px; cursor: pointer; transition: transform .15s, box-shadow .3s; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
  .pill:hover { box-shadow: 0 0 24px rgba(169,230,245,.5); }
  .pill:active { transform: scale(.96); }
  .pill.ghost { background: rgba(169,230,245,.08); color: var(--ice); outline: 1px solid rgba(169,230,245,.35); outline-offset: -1px; }

  /* hud */
  #hud { position: fixed; left: 24px; right: 24px; top: 20px; z-index: 5; display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; letter-spacing: .24em; text-transform: uppercase; font-weight: 700; color: var(--ice); opacity: 0; transition: opacity 1s .8s; pointer-events: none; }
  #hud.on { opacity: .8; }
  #hud a { color: inherit; text-decoration: none; pointer-events: auto; }
  #hint { position: fixed; left: 0; right: 0; bottom: 26px; z-index: 5; text-align: center; font-size: 11px; letter-spacing: .28em; text-transform: uppercase;
    font-weight: 700; color: var(--ice); opacity: 0; transition: opacity .5s; pointer-events: none; }
  #hint.on { opacity: .85; }

  /* panel: the list and the reader */
  #panel { position: fixed; inset: 0; z-index: 10; display: none; overflow-y: auto; background: rgba(5,9,12,0); opacity: 0; transition: opacity .6s; }
  #panel.open { display: block; }
  #panel.show { opacity: 1; background: rgba(4,8,11,.84); backdrop-filter: blur(6px); }
  .simple #panel { background: transparent; backdrop-filter: none; z-index: 1; }
  .sheet { max-width: 700px; margin: 0 auto; padding: 72px 22px 120px; position: relative; }
  .sheet .close { position: fixed; top: 18px; right: 22px; z-index: 12; }
  .simple .sheet { padding-top: 28px; }
  .simple .sheet .close { position: static; display: block; margin: 0 0 30px auto; }
  .sheet .eyebrow { font-size: 11px; letter-spacing: .28em; text-transform: uppercase; font-weight: 700; color: var(--brass); }
  .sheet h2 { font-family: var(--serif); font-size: clamp(30px, 6vw, 46px); line-height: 1.12; letter-spacing: .04em; text-transform: uppercase; margin: 10px 0 14px; }
  .sheet .rule { height: 12px; margin: 0 0 22px; background:
      linear-gradient(var(--brass), var(--brass)) left center / calc(50% - 14px) 1px no-repeat,
      linear-gradient(var(--brass), var(--brass)) right center / calc(50% - 14px) 1px no-repeat;
    position: relative; opacity: .7; }
  .sheet .rule::after { content: ""; position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px; transform: rotate(45deg); border: 1px solid var(--brass); }
  .item { display: block; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid rgba(184,147,90,.28);
    color: inherit; font: inherit; padding: 22px 0; cursor: pointer; }
  .grp .item:last-child { border-bottom: 1px solid rgba(184,147,90,.28); }
  .item .d { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--brass); font-weight: 700; }
  .item h3 { margin: 6px 0 6px; font-family: var(--serif); letter-spacing: .03em; font-size: 21px; transition: color .2s, text-shadow .3s; }
  .item p { margin: 0; opacity: .66; font-size: 14.5px; line-height: 1.6; }
  .item:hover h3, .item:focus-visible h3 { color: var(--ice); text-shadow: 0 0 18px rgba(169,230,245,.45); }
  .back { font: inherit; background: none; border: 0; color: var(--ice); cursor: pointer; font-size: 11px; letter-spacing: .2em; text-transform: uppercase;
    font-weight: 700; opacity: .8; padding: 0; margin-bottom: 18px; }
  .meta { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--brass); font-weight: 700; margin: 0 0 32px; }
  .prose { font-size: 17.5px; line-height: 1.9; font-weight: 500; }
  .prose h2, .prose h3 { font-family: var(--serif); letter-spacing: .03em; font-size: 22px; margin: 2em 0 .4em; color: var(--ice); text-transform: none; }
  .prose a { color: var(--ice); }
  .prose blockquote { margin: 1.6em 0; padding-left: 20px; border-left: 2px solid var(--brass); font-style: italic; opacity: .9; }
  .prose blockquote p { margin: 0; }
  .prose code { background: rgba(169,230,245,.1); padding: 2px 6px; border-radius: 3px; font-size: .9em; }
  .prose pre { background: rgba(0,0,0,.45); padding: 16px; border-radius: 4px; overflow: auto; border: 1px solid rgba(169,230,245,.15); }
  .prose pre code { background: none; padding: 0; }
  .vol { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 42px 0 2px; }
  .vol:first-of-type { margin-top: 6px; }
  .vol .vn { font-family: var(--serif); font-size: 14px; letter-spacing: .24em; text-transform: uppercase; color: var(--brass); font-weight: 700; }
  .vol .vn::before { content: ""; display: inline-block; width: 7px; height: 7px; margin: 0 12px 1px 0; transform: rotate(45deg); background: var(--brass); box-shadow: 0 0 10px rgba(184,147,90,.6); }
  .vol .vc { font-size: 10.5px; letter-spacing: .22em; text-transform: uppercase; opacity: .5; font-weight: 700; }
  .vol .vx { font: inherit; font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; font-weight: 700; color: var(--ice); background: none; border: 0; cursor: pointer; opacity: .7; padding: 0; }
  .item .tag { display: inline-block; margin-left: 10px; padding: 2px 8px; font-size: 9.5px; letter-spacing: .22em; color: var(--ice); outline: 1px solid rgba(169,230,245,.5); outline-offset: -1px; vertical-align: 1px; }
  .item.draft h3 { opacity: .78; }
  .empty { opacity: .6; padding: 24px 0; }
  .door { color: inherit; text-decoration: none; letter-spacing: .24em; text-transform: uppercase; font-size: 10.5px; font-weight: 700; margin-left: 14px; opacity: .8; border-bottom: 1px dotted rgba(232,226,214,.5); }
  .site { margin-top: 56px; font-size: 12px; opacity: .55; }
  .site a { color: inherit; }
</style>

<body>
<div id="bg" aria-hidden="true"><div class="fog"></div><div class="fog b"></div></div>
<canvas id="scene" aria-hidden="true"></canvas>

<div id="opener">
  <div>
    <div class="sigil" id="sigil" aria-hidden="true"></div>
    <div class="k">The sealed side of limvoid</div>
    <h1>The Codex</h1>
    <p>Writings set down by machine light. Read, never altered.</p>
    <button class="pill" id="enter" type="button">Unseal</button>
  </div>
</div>

<div id="hud"><a href="https://limvoid.com">← limvoid.com</a><span>Codex</span></div>
<div id="hint">Open the codex</div>

<div id="panel" role="dialog" aria-modal="true" aria-label="Codex entries" inert>
  <div class="sheet" id="sheet"></div>
</div>

<script type="module">
import * as THREE from 'three';

const $ = s => document.querySelector(s);
const panel = $('#panel'), sheet = $('#sheet'), hint = $('#hint'), hud = $('#hud');
const params = new URLSearchParams(location.search);
const fmt = d => new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

/* ---------- ornament: one small SVG wheel, reused for the opener and the phone background ---------- */
function gearSVG(teeth, stroke, sw) {
  const rO = 96, rI = 84, st = Math.PI * 2 / teeth; let d = '';
  for (let i = 0; i < teeth; i++) { const a = i * st; [[0, rI], [.22, rO], [.5, rO], [.72, rI]].forEach(([f, r], k) => { d += (i === 0 && k === 0 ? 'M' : 'L') + (100 + Math.cos(a + f * st) * r).toFixed(1) + ' ' + (100 + Math.sin(a + f * st) * r).toFixed(1); }); }
  let spokes = ''; for (let k = 0; k < 6; k++) { const a = k / 6 * Math.PI * 2; spokes += `M${(100 + Math.cos(a) * 18).toFixed(1)} ${(100 + Math.sin(a) * 18).toFixed(1)}L${(100 + Math.cos(a) * 58).toFixed(1)} ${(100 + Math.sin(a) * 58).toFixed(1)}`; }
  return `<svg viewBox="0 0 200 200" fill="none" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"><path d="${d}Z"/><circle cx="100" cy="100" r="66"/><circle cx="100" cy="100" r="58" stroke-dasharray="3 5"/><circle cx="100" cy="100" r="18"/><path d="${spokes}"/></svg>`;
}
$('#sigil').innerHTML = gearSVG(18, '#B8935A', 3.2);
{ const bg = $('#bg'); bg.insertAdjacentHTML('afterbegin', gearSVG(30, '#A9E6F5', 1.4).replace('<svg', '<svg class="gear"') + gearSVG(22, '#B8935A', 1.6).replace('<svg', '<svg class="gear two"')); }

/* ---------- posts: list + reader (used by both the 3D desk and the simple version) ---------- */
let POSTS = [];
let panelOpen = false;
const hooks = {};   // the scribe plugs in here, only after sign-in
const roman = n => { let s = ''; for (const [v, r] of [[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']]) while (n >= v) { s += r; n -= v; } return s; };
const tail = id => id.split('/').pop().replace(/^\d{4}-\d{2}-\d{2}-/, '');
const pretty = v => v.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
// One renderer for the public shelf and the scribe's shelf. Items: {slug,title,date,summary,minutes,volume,draft}
function renderList(items, o = {}) {
  sheet.replaceChildren();
  const close = el('button', 'pill ghost close', simple ? 'limvoid.com' : 'Close'); close.type = 'button';
  close.onclick = simple ? () => { location.href = 'https://limvoid.com'; } : closePanel;
  sheet.append(close, el('div', 'eyebrow', 'Writings · thoughts · ideas'), el('h2', null, 'The Codex'), el('div', 'rule'));
  if (o.top) sheet.append(o.top);
  const sealed = items.filter(p => !p.draft).sort((a, b) => (a.date + a.slug).localeCompare(b.date + b.slug));
  const folio = new Map(sealed.map((p, i) => [p, i + 1]));
  const vols = [...new Set([...(o.volumes || []), ...items.map(p => p.volume).filter(Boolean)])].sort();
  const groups = vols.map(v => [v, items.filter(p => p.volume === v)]); groups.push(['', items.filter(p => !p.volume)]);
  const open = o.onOpen || (p => readView(p.slug, true));
  if (!items.length && !vols.length) sheet.append(el('p', 'empty', 'Nothing written here yet.'));
  for (const [v, list] of groups) {
    if (!list.length && !(v && o.volumes)) continue;
    if (v) {
      const h = el('div', 'vol'); h.append(el('span', 'vn', pretty(v)));
      if (!list.length && o.onRemoveVolume) { const x = el('button', 'vx', 'Remove empty volume'); x.type = 'button'; x.onclick = () => o.onRemoveVolume(v); h.append(x); }
      else h.append(el('span', 'vc', list.length + (list.length === 1 ? ' folio' : ' folios')));
      sheet.append(h);
    } else if (vols.length) sheet.append(Object.assign(el('div', 'vol'), { innerHTML: '<span class="vn">Loose folios</span>' }));
    const g = el('div', 'grp');
    list.forEach(p => {
      const b = el('button', 'item' + (p.draft ? ' draft' : '')); b.type = 'button';
      const d = el('div', 'd', (p.draft ? 'Unsealed' : 'Folio ' + roman(folio.get(p))) + ' · ' + fmt(p.date) + ' · ' + p.minutes + ' min');
      const h3 = el('h3', null, p.title || 'Untitled'); if (p.draft) h3.append(el('span', 'tag', 'Draft'));
      b.append(d, h3, el('p', null, p.summary)); b.onclick = () => open(p); g.append(b);
    });
    sheet.append(g);
  }
  const foot = Object.assign(el('p', 'site'), { innerHTML: 'Part of <a href="https://limvoid.com">limvoid.com</a>.' });
  if (!o.noDoor) { const door = el('a', 'door', 'Scribe'); door.href = '#'; door.onclick = e => { e.preventDefault(); loadScribe().then(sc => sc.signin()); }; foot.append(door); }
  sheet.append(foot);
  panel.scrollTop = 0;
}
function listView() { if (hooks.list) return hooks.list(); renderList(POSTS); }
function readView(slug, push) {
  const p = POSTS.find(x => x.slug === slug); if (!p) return listView();
  sheet.replaceChildren();
  const back = el('button', 'back', '← all entries'); back.type = 'button';
  back.onclick = () => { history.replaceState(null, '', location.pathname + location.search); listView(); };
  const art = el('article', 'prose'); art.innerHTML = p.html;
  sheet.append(back, el('h2', null, p.title), el('p', 'meta', fmt(p.date) + ' · ' + p.minutes + ' min read'), art);
  if (hooks.read) hooks.read(p);
  if (push) history.replaceState(null, '', '#' + slug);
  panel.scrollTop = 0; document.title = p.title + ' · The Codex';
}
async function refreshPublic() { try { POSTS = await (await fetch('posts.json?' + Date.now())).json(); } catch {} }
let scribeP;
const loadScribe = () => scribeP ||= import('./scribe.js?v=1').then(m => m.init({ el, fmt, roman, tail, pretty, renderList, readView, listView, refreshPublic, sheet, panel, hooks, hud,
  isOpen: () => panelOpen, isSimple: () => simple, showPanel: () => (panelOpen || (simple ? 0 : showPanel())) }));
function showPanel() {
  panel.classList.add('open'); panel.inert = false; panelOpen = true;
  requestAnimationFrame(() => panel.classList.add('show'));
  const h = location.hash.slice(1); h ? readView(h, false) : listView();
}
function closePanel() {
  panel.classList.remove('show'); panelOpen = false; panel.inert = true;
  document.title = "The Codex · limvoid";
  setTimeout(() => { if (!panelOpen) panel.classList.remove('open'); }, 650);
  onPanelClosed();
}

/* ---------- which version? the 3D desk needs WebGL, a fine pointer, a real screen and motion allowed ---------- */
function webgl() { try { const c = document.createElement('canvas'); return !!(c.getContext('webgl2') || c.getContext('webgl')); } catch { return false; } }
const simple = params.has('simple') || matchMedia('(pointer: coarse)').matches || innerWidth < 760
  || matchMedia('(prefers-reduced-motion: reduce)').matches || !webgl();
let onPanelClosed = () => {};

try { POSTS = await (await fetch('posts.json')).json(); } catch { POSTS = []; }
fetch('/api/me', { credentials: 'same-origin' }).then(r => r.ok ? r.json() : null).then(m => { if (m && m.authed) loadScribe().then(sc => sc.enter()); }).catch(() => {});

if (simple) {
  document.body.classList.add('simple'); $('#opener').remove(); hud.remove(); hint.remove();
  panel.classList.add('open', 'show'); panel.inert = false; panelOpen = true;
  const h = location.hash.slice(1); h ? readView(h, false) : listView();
  addEventListener('hashchange', () => { const s = location.hash.slice(1); s ? readView(s, false) : listView(); });
} else {
  /* ---------- the 3D chamber ---------- */
  const canvas = $('#scene');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x04080b); scene.fog = new THREE.Fog(0x04080b, 12, 42);
  const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 40);
  const resize = () => { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); };
  addEventListener('resize', resize); resize();

  const ICE = 0x9be8ff, BRASS = 0xb8935a;
  const std = (color, rough = .6, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: .35, ...extra });
  const mesh = (geo, mat, x = 0, y = 0, z = 0, parent = scene) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; parent.add(m); return m; };
  const brass = std(BRASS, .35, { metalness: .8 }), iron = std(0x1b2329, .5, { metalness: .7 }), darkIron = std(0x10161a, .6, { metalness: .6 });

  /* a toothed wheel with a hub and round cut-outs, extruded */
  function gearGeo(rOut, rIn, teeth, depth, spokes = 5) {
    const sh = new THREE.Shape(), step = Math.PI * 2 / teeth;
    for (let i = 0; i < teeth; i++) {
      const a = i * step;
      [[0, rIn], [.22, rOut], [.5, rOut], [.72, rIn]].forEach(([f, r], k) => { const x = Math.cos(a + f * step) * r, y = Math.sin(a + f * step) * r; (i === 0 && k === 0) ? sh.moveTo(x, y) : sh.lineTo(x, y); });
    }
    const hole = new THREE.Path(); hole.absarc(0, 0, rIn * .16, 0, Math.PI * 2, true); sh.holes.push(hole);
    for (let k = 0; k < spokes; k++) { const a = k / spokes * Math.PI * 2, p = new THREE.Path(); p.absarc(Math.cos(a) * rIn * .56, Math.sin(a) * rIn * .56, rIn * .2, 0, Math.PI * 2, true); sh.holes.push(p); }
    return new THREE.ExtrudeGeometry(sh, { depth, bevelEnabled: false, curveSegments: 20 });
  }

  /* the back wall: a vast wheel behind the throne with a cold halo */
  mesh(new THREE.PlaneGeometry(44, 26), std(0x05080b, .9), 0, 8, -11.8).castShadow = false;
  const halo = new THREE.Mesh(new THREE.TorusGeometry(5.9, .03, 8, 200), new THREE.MeshBasicMaterial({ color: ICE, transparent: true, opacity: .5 })); halo.position.set(-.1, 6.6, -11.4); scene.add(halo);
  const halo2 = new THREE.Mesh(new THREE.TorusGeometry(6.3, .012, 8, 200), new THREE.MeshBasicMaterial({ color: BRASS, transparent: true, opacity: .55 })); halo2.position.copy(halo.position); scene.add(halo2);
  const wheels = [
    { g: mesh(gearGeo(5.5, 4.9, 56, .25, 9), std(0x171c20, .5, { metalness: .6 }), -.1, 6.6, -11.5), w: .025 },
    { g: mesh(gearGeo(2.6, 2.25, 28, .25, 7), std(0x2a2318, .45, { metalness: .7 }), -8.4, 8.2, -11.4), w: -.05 },
    { g: mesh(gearGeo(2.0, 1.72, 22, .25, 6), std(0x171c20, .5, { metalness: .6 }), 8.0, 7.6, -11.4), w: .065 }
  ];
  wheels.forEach(o => { o.g.castShadow = false; o.g.scale.setScalar(1.3); }); halo.scale.setScalar(1.3); halo2.scale.setScalar(1.3);

  /* the dais: wide steps climbing a long way back to the throne */
  const DESK_Y = 1.0;

    mist.forEach(s => { s.position.x += s.userData.sp * dt; if (s.position.x > 4.6) s.position.x = -4.6; if (s.position.x < -4.6) s.position.x = 4.6; s.position.y = s.userData.base + Math.sin(t * .3 + s.position.x) * .03; });
    const p = dgeo.attributes.position; for (let i = 0; i < N; i++) { let y = p.getY(i) + vel[i] * dt * .8 + Math.sin(t + i) * .0004; if (y > DESK_Y + 2.8) y = DESK_Y + .1; p.setY(i, y); p.setX(i, p.getX(i) + Math.sin(t * .5 + i) * .0006); } p.needsUpdate = true;
    renderer.render(scene, camera);
  })();
}
